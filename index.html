<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Senvite.ID — Generator Link Undangan Tamu</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Poppins', sans-serif; background-color: #FAF7F2; }
  </style>
</head>
<body class="p-4 sm:p-8 text-slate-800">

  <div class="max-w-4xl mx-auto">
    <!-- HEADER DENGAN LOGO SENVITE -->
    <div class="flex flex-col items-center justify-center mb-8 text-center">
      <div class="flex items-center gap-2.5 mb-1.5">
        <img src="logo.png" alt="Senvite Logo" class="h-9 sm:h-11 w-auto object-contain">
        <span class="flex flex-col leading-none text-left">
          <span class="text-xl sm:text-2xl font-extrabold tracking-tight text-[#4A154B]">SENVITE.ID</span>
          <span class="text-[9px] sm:text-[10px] text-slate-500 tracking-[0.2em] font-medium">INVITATION</span>
        </span>
      </div>
      <p class="text-xs sm:text-sm text-slate-600">Generator Link Undangan Berdasarkan Nama Tamu & Draf Pesan WhatsApp Tamu</p>
    </div>

    <!-- FORM INPUT -->
    <div class="bg-white p-5 sm:p-7 rounded-2xl shadow-sm border border-slate-200 space-y-5">
      <div>
        <label class="block text-xs sm:text-sm font-semibold mb-1">1. Masukkan Link Web Undangan (Tanpa Parameter Nama)</label>
        <input type="url" id="baseUrl" placeholder="Contoh: https://wedding-nadyalathif-senviteinvitati.vercel.app" class="w-full p-3 border rounded-xl text-xs sm:text-sm focus:outline-none focus:ring-2 focus:ring-[#4A154B]">
      </div>

      <div>
        <label class="block text-xs sm:text-sm font-semibold mb-1">2. Masukkan Daftar Nama Tamu (1 Nama Per Baris)</label>
        <textarea id="guestList" rows="6" placeholder="Aisyah Salma&#10;Budi Santoso & Partner&#10;dr. Hendra, Sp.A&#10;Keluarga Besar Alm. Subroto" class="w-full p-3 border rounded-xl text-xs sm:text-sm focus:outline-none focus:ring-2 focus:ring-[#4A154B]"></textarea>
      </div>

      <div class="flex flex-col sm:flex-row gap-3">
        <button onclick="generateLinks()" class="flex-1 bg-[#4A154B] hover:bg-[#3B123D] text-white font-semibold py-3 rounded-xl text-xs sm:text-sm transition-all flex items-center justify-center gap-2 cursor-pointer">
          <i class="fa-solid fa-wand-magic-sparkles"></i> Buat Link Otomatis
        </button>
        <button onclick="downloadCSV()" id="btnDownload" class="hidden bg-emerald-600 hover:bg-emerald-700 text-white font-semibold px-5 py-3 rounded-xl text-xs sm:text-sm transition-all flex items-center justify-center gap-2 cursor-pointer">
          <i class="fa-solid fa-file-excel"></i> Download File Excel (.csv)
        </button>
      </div>
    </div>

    <!-- HASIL GENERATE -->
    <div id="resultContainer" class="hidden mt-8 space-y-4">
      <div class="flex items-center justify-between">
        <h2 class="font-bold text-base sm:text-lg text-[#4A154B]">Hasil Link & Pesan Siap Sebar (<span id="totalGuests">0</span> Tamu)</h2>
      </div>

      <div id="outputList" class="space-y-3">
        <!-- Kartu hasil akan dirender di sini via JS -->
      </div>
    </div>
  </div>

  <script>
    let generatedData = [];

    function generateLinks() {
      const baseUrlInput = document.getElementById('baseUrl').value.trim();
      const guestListInput = document.getElementById('guestList').value.trim();

      if (!baseUrlInput || !guestListInput) {
        alert('Mohon isi Link Web Undangan dan Daftar Nama Tamu terlebih dahulu ya.');
        return;
      }

      const cleanBaseUrl = baseUrlInput.replace(/\/+$/, "");
      const names = guestListInput.split('\n').filter(name => name.trim() !== '');

      generatedData = [];
      const outputList = document.getElementById('outputList');
      outputList.innerHTML = '';

      names.forEach((name) => {
        const trimmedName = name.trim();
        const guestLink = `${cleanBaseUrl}/?to=${encodeURIComponent(trimmedName)}`;
        
        const waMessage = `Kepada Yth.\n${trimmedName}\n\nTanpa mengurangi rasa hormat, perkenankan kami mengundang Bapak/Ibu/Saudara/i untuk menghadiri hari bahagia kami:\n${guestLink}\n\nMerupakan suatu kehormatan dan kebahagiaan bagi kami apabila berkenan hadir dan memberikan doa restu.\n\nTerima kasih.`;

        generatedData.push({ nama: trimmedName, link: guestLink, pesan: waMessage });

        // Render Kartu Hasil
        const card = document.createElement('div');
        card.className = "bg-white p-4 rounded-xl shadow-sm border border-slate-200 flex flex-col sm:flex-row items-start sm:items-center justify-between gap-3";
        card.innerHTML = `
          <div class="overflow-hidden w-full">
            <h3 class="font-bold text-xs sm:text-sm text-[#4A154B]">${trimmedName}</h3>
            <p class="text-[11px] sm:text-xs text-slate-500 truncate mt-0.5">${guestLink}</p>
          </div>
          <div class="flex items-center gap-2 w-full sm:w-auto shrink-0">
            <button onclick="copyText('${escapeJs(guestLink)}', this)" class="flex-1 sm:flex-none text-[11px] sm:text-xs bg-slate-100 hover:bg-slate-200 text-slate-700 px-3 py-2 rounded-lg font-medium transition-all flex items-center justify-center gap-1 cursor-pointer">
              <i class="fa-regular fa-copy"></i> Copy Link
            </button>
            <button onclick="copyText('${escapeJs(waMessage)}', this)" class="flex-1 sm:flex-none text-[11px] sm:text-xs bg-emerald-50 hover:bg-emerald-100 text-emerald-700 border border-emerald-200 px-3 py-2 rounded-lg font-medium transition-all flex items-center justify-center gap-1 cursor-pointer">
              <i class="fa-brands fa-whatsapp"></i> Copy Teks WA
            </button>
          </div>
        `;
        outputList.appendChild(card);
      });

      document.getElementById('totalGuests').textContent = names.length;
      document.getElementById('resultContainer').classList.remove('hidden');
      document.getElementById('btnDownload').classList.remove('hidden');
    }

    function escapeJs(text) {
      return text.replace(/'/g, "\\'").replace(/\n/g, "\\n");
    }

    function copyText(text, btn) {
      navigator.clipboard.writeText(text.replace(/\\n/g, '\n')).then(() => {
        const originalHtml = btn.innerHTML;
        btn.innerHTML = `<i class="fa-solid fa-check"></i> Tersalin!`;
        btn.classList.add('bg-emerald-600', 'text-white');
        setTimeout(() => {
          btn.innerHTML = originalHtml;
          btn.classList.remove('bg-emerald-600', 'text-white');
        }, 1500);
      });
    }

    // FUNGSI DOWNLOAD CSV PERBAIKAN (MENGGUNAKAN TITIK KOMA & UTF-8 BOM)
    function downloadCSV() {
      if (generatedData.length === 0) return;

      // Pemisah kolom menggunakan titik koma (;) agar rapi di Excel
      const delimiter = ";";
      let csvRows = [];
      
      // Header
      csvRows.push(["Nama Tamu", "Link Undangan", "Pesan WA Siap Sebar"].join(delimiter));

      // Isi Data
      generatedData.forEach(row => {
        const nameEscaped = `"${row.nama.replace(/"/g, '""')}"`;
        const linkEscaped = `"${row.link.replace(/"/g, '""')}"`;
        const messageEscaped = `"${row.pesan.replace(/"/g, '""')}"`;
        
        csvRows.push([nameEscaped, linkEscaped, messageEscaped].join(delimiter));
      });

      // Tambahkan BOM (\uFEFF) agar UTF-8 terbaca presisi di Microsoft Excel & Google Sheets
      const csvString = "\uFEFF" + csvRows.join("\n");
      const blob = new Blob([csvString], { type: "text/csv;charset=utf-8;" });
      
      const link = document.createElement("a");
      const url = URL.createObjectURL(blob);
      link.setAttribute("href", url);
      link.setAttribute("download", "Daftar_Link_Tamu_Senvite.csv");
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      URL.revokeObjectURL(url);
    }
  </script>
</body>
</html>
